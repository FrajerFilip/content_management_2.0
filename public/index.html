<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        // pouze kroky 4px mřížky
        spacing: {
          0: '0px', 1: '4px', 2: '8px', 3: '12px', 4: '16px', 5: '20px', 6: '24px', 7: '28px', 9: '36px',
          8: '32px', 10: '40px', 12: '48px', 16: '64px', 20: '80px', 24: '96px', 80: '320px',
        },
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            // jedna neutrální grafitová rampa + jeden akcent
            ink: {
              950: '#111213', 900: '#18191b', 850: '#1e1f22', 800: '#26272a',
              600: '#5c5e63', 400: '#8d8f94', 200: '#c9cacd', 50: '#ececee',
            },
            accent: { DEFAULT: '#e8a33d', ink: '#111213' },
          },
          transitionTimingFunction: { ui: 'cubic-bezier(0.2, 0, 0, 1)' },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-ink-950 text-ink-50 font-sans antialiased">
  <div class="min-h-screen flex flex-col lg:flex-row">

    <!-- Ovládání: potlačené -->
    <aside class="lg:w-80 shrink-0 border-b lg:border-b-0 lg:border-r border-hair flex flex-col gap-6 p-6">
      <header class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-sm bg-accent" aria-hidden="true"></span>
        <span class="text-sm font-medium">Frame</span>
        <span class="ml-auto font-mono text-xs text-ink-600">v1</span>
      </header>

      <form id="form" class="flex flex-col gap-3">
        <label for="prompt" class="text-xs text-ink-400">Popis animace</label>
        <textarea id="prompt" rows="6" maxlength="2000" required
          class="w-full resize-none rounded-lg bg-ink-900 border border-hair p-3 text-sm leading-5 text-ink-50 placeholder:text-ink-600 focus-ring transition-colors duration-150 ease-ui"
          placeholder="Hejno ptáků nad jezerem při západu slunce, pomalý pohyb, teplé tóny"></textarea>
        <div class="flex items-center gap-2">
          <button id="submit" type="submit"
            class="h-9 px-4 rounded-lg bg-accent text-accent-ink text-sm font-medium inline-flex items-center gap-2 focus-ring transition-[background-color,transform] duration-150 ease-ui hover:bg-[#f0b153] active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            <span id="submit-label">Generovat</span>
          </button>
          <span class="ml-auto font-mono text-xs text-ink-600 tabular-nums"><span id="count">0</span>/2000</span>
        </div>
        <p class="text-xs text-ink-600"><kbd class="keycap">Ctrl</kbd> <kbd class="keycap">Enter</kbd> spustí generování</p>
      </form>

      <section class="flex flex-col gap-2">
        <h2 class="text-xs text-ink-400">Příklady</h2>
        <ul id="examples" class="flex flex-col gap-1">
          <li><button type="button" class="example">Částicový déšť reagující na gravitaci</button></li>
          <li><button type="button" class="example">Rotující drátěný model planety v SVG</button></li>
          <li><button type="button" class="example">Lissajousovy křivky kreslené jednou čarou</button></li>
        </ul>
      </section>

      <p id="status" role="status" aria-live="polite" class="text-xs text-ink-400 min-h-5"></p>
    </aside>

    <!-- Plátno: jediný výrazný prvek -->
    <main class="flex-1 flex flex-col gap-3 p-4 lg:p-8 min-w-0">
      <div class="flex items-center gap-3 text-xs text-ink-400">
        <span id="stage-title" class="truncate">Bez animace</span>
        <span id="timecode" class="ml-auto font-mono tabular-nums text-ink-600">00:00:00</span>
        <button id="reload" type="button" class="tool-btn" title="Přehrát znovu" aria-label="Přehrát znovu" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="download" type="button" class="tool-btn" title="Stáhnout HTML" aria-label="Stáhnout HTML" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button id="fullscreen" type="button" class="tool-btn" title="Celá obrazovka" aria-label="Celá obrazovka" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>

      <div id="stage" class="stage relative flex-1 min-h-80 rounded-2xl overflow-hidden bg-black">
        <div id="empty" class="absolute inset-0 flex flex-col items-center justify-center gap-2 text-center p-6">
          <svg class="icon text-ink-600" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/><path d="M16 4v5"/></svg>
          <p class="text-sm text-ink-400">Popiš animaci vlevo a vygeneruj ji</p>
          <p class="text-xs text-ink-600">Kód běží v izolovaném rámci bez přístupu k síti a k této stránce</p>
        </div>
        <div id="loading" class="absolute inset-0 hidden items-center justify-center">
          <p class="font-mono text-xs text-ink-400">Generuji kód<span id="elapsed" class="tabular-nums"> 0 s</span></p>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
